[package]
name = "op_clicker_4"
version = "4.0.0"
edition = "2021"
description = "A lightweight Rust auto-clicker with Minecraft and Roblox profiles"
authors = ["OP Clicker 4.0"]
license = "MIT"

[dependencies]
eframe = "0.32.3"
enigo = "0.2.1"
device_query = "4.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
